# Starter tmux config — adoption roadmap item 2 (2026-07-10). Trim/extend as habits form.

# Prefix: Ctrl-Space (C-b default is awkward; C-a clashes with shell start-of-line)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color + sane terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse (click panes/tabs, scroll, resize)
set -g mouse on

# Forward terminal focus in/out to the pane (TUIs like Claude Code need this for scroll focus)
set -g focus-events on

# Let Claude Code's escape sequences reach iTerm2. Without passthrough, tmux drops its
# desktop notifications and the tab progress bar (OSC 9;4).
set -g allow-passthrough on

# Pass modified keys such as Shift+Enter (Claude's newline) through to apps.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Big scrollback for agent output
set -g history-limit 100000

# Windows/panes start at 1; renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window name = whatever the app puts in the terminal title (pane_title):
#   Claude → its session title, vim → the open file (needs `set title` in .vimrc).
# Falls back to the process name when the app sets no title (plain shells, where the
# title is just the hostname) — otherwise every shell window would read "parth.ganatra-…".
# Without this, claude windows are all named "2.1.220": the native-installer binary
# literally is ~/.local/share/claude/versions/2.1.220, and tmux names windows after the command.
# The s/// strips Claude's leading spinner glyph so the name doesn't flicker on every frame.
set -g automatic-rename-format '#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{pane_current_command},#{=/24/…:#{s/^[^A-Za-z0-9] //:pane_title}}}'

# vi keys in copy mode (you're a vim user)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Intuitive splits: prefix + | (side by side), prefix + - (stacked); keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Fast window switching: prefix + n/p, or Shift+arrows without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# Jump straight to a window by number: Alt+1..9 (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Session switching:
#   prefix + Tab        → toggle to last session (fast A/B between two repos)
#   Alt + o (no prefix) → fuzzy popup of ALL sessions, most-recently-attached first, each
#                         annotated with what its Claude agents are doing (needs fzf).
#                         Alt-o is NAVIGATE (everything, including plain-shell sessions);
#                         Alt-i is TRIAGE (ccmux: only agents, ordered by who needs you).
bind Tab switch-client -l
bind -n M-o display-popup -E -w 80% -h 60% "tmux-session-picker"

# Sessionizer: Alt-p → fuzzy-jump to a project dir, creating the session on demand
# (new session opens a shell + resumes the last Claude convo for that dir). See ~/bin/tmux-sessionizer.
# NB: NOT M-f — iTerm sends ESC f for Option+RightArrow (readline forward-word), which would collide.
bind -n M-p display-popup -E "tmux-sessionizer"

# Agent triage: Alt-i → ccmux picker, every agent across every session in one list with
# its state (idle / working / waiting, and *why* it is waiting), age, and branch. Enter
# jumps to the pane; the preview pane can be typed into to answer without switching.
# Needs the daemon: `ccmux daemon start -b` (it survives detach, PPID 1, but not a reboot).
# M-i is ESC+i and does not collide with M-Tab (ESC+0x09) or the M-1..M-9 window jumps.
bind -n M-i display-popup -E -w 90% -h 85% "ccmux picker"

# Diff review: Alt-g → hunk (brew install hunk) on the current pane's repo, reloading as
# files change. To send line notes back to a Claude session, review it from the Alt-i
# picker instead: d for uncommitted changes, D for everything since the branch forked.
bind -n M-g display-popup -E -w 95% -h 90% -d '#{pane_current_path}' '[ -n "$(git status --porcelain 2>/dev/null)" ] && exec hunk diff --watch; echo "No uncommitted changes here."; sleep 1.5'
# Prune: prefix + X → kill current session (tmux hops you to another); reopen with Alt-p
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Status bar at bottom (2026-07-15: Parth's eyes live at the bottom of the screen while typing);
# colors/styling handled by Catppuccin (composed below run tpm)
set -g status-position bottom
# One status line. Explicit because `source-file` never UNSETS an option: after the
# second line was dropped (2026-08-20) a plain reload left the running server still
# on `status 2`, drawing a now-empty row. Stating it makes a reload idempotent.
set -g status on

# Resize panes: prefix + H/J/K/L (repeatable, 5 cells per tap)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Clear screen (Ctrl-l is taken by pane nav): Option+k clears, Option+l clears + wipes scrollback
bind -n M-k send-keys C-l
bind -n M-l send-keys C-l \; clear-history

# Don't wait after Esc (matters in vim)
set -sg escape-time 10

# Reload this config: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ---- Plugins (TPM) ----
# Install/update: prefix + I  (capital i). Update: prefix + U. Remove: prefix + alt-u.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across vim splits + tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'           # robust copy to macOS clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions (prefix + Ctrl-s / Ctrl-r)
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save every 15m, auto-restore on start
set -g @plugin 'catppuccin/tmux'                  # theme

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'   # restore on-screen text, not just layout
set -g @resurrect-processes '"~claude"'         # relaunch claude on full restart/reboot

# Catppuccin theme options (must be set before tpm loads the plugin)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# ccmux's mark (red ■ waiting, green ● unread) follows the name; clicking it opens the picker.
set -g @catppuccin_window_text " #{=|24|…:window_name}#[range=user|ccmux]#{@ccmux_mark}#[range=window|#{window_index}]"      # name only, truncated to 24 chars
set -g @catppuccin_window_current_text " #{=|24|…:window_name}#[range=user|ccmux]#{@ccmux_mark}#[range=window|#{window_index}]"

# ---- Cross-session attention ----
# The DIY second status line (agents-bar.sh) was REMOVED 2026-08-20: it sorted sessions by
# MOST-recently-attached and kept 4 slots, so the sessions worth surfacing — the forgotten
# ones — were exactly the ones it collapsed into an anonymous "+2💬" overflow chip. It also
# never tracked age for `working` agents and had no seen/acked state, so `done` never
# cleared and the whole row aged into wallpaper. Replaced by two pickers you open on
# demand: Alt-i (ccmux, triage) and Alt-o (tmux-session-picker, navigate).
# agents-bar.sh is left on disk, unwired, in case the neglect-sorted rewrite is ever wanted.
#
# ~/bin/claude-state still runs from the Claude Code hooks in ~/.claude/settings.json and
# records working/waiting/done per pane — it now feeds only prefix-l, which jumps to
# whichever agent has been waiting longest. ccmux tracks the same states independently
# via its own hooks, so prefix-l and Alt-i are two readings of the same thing.
# workmux stays installed for `workmux add/merge/remove` (worktrees).
bind l run-shell "~/bin/claude-next"

# ccmux 1.4.4 publishes @ccmux_status (counts) and a per-window @ccmux_mark; both are
# wired into the status line below. A click on either opens the picker (same popup as
# Alt-i); a click anywhere else in the status line keeps tmux's default, select-window.
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},ccmux}' {
  display-popup -E -w 90% -h 85% 'ccmux picker'
} {
  select-window -t =
}

# ---- Status line composition (after Catppuccin is loaded) ----
# Identity left, ambient info right — session anchors the left corner in an accent pill
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-left-length 30
# Right side, left→right: ccmux attention counts (■ waiting, ● unread; empty when none) · git (branch+divergence+dirty) · low-battery warning (only when <=20% on battery) · time
set -g status-right-length 120
set -g status-right '#{?@ccmux_status,#[range=user|ccmux]#{@ccmux_status}#[norange] ,}'
set -ag status-right '#(~/.config/tmux/gitmux-seg.sh "#{pane_current_path}")'
set -ag status-right "#(~/.config/tmux/battery-low.sh)"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %a %H:%M"
# gitmux needs a working tree; segment is empty in non-repo panes. Refresh cadence = status-interval.


# Pane focus cues: accent border on active pane, one-step-darker inactive panes (Catppuccin Mocha)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"
# window-style/window-active-style dimming removed — vim's own highlight (guibg=#181825) now owns that contrast

# Label each pane border with its running command (vim / claude / zsh)
set -g pane-border-status top
set -g pane-border-format " #[fg=#6c7086]#{pane_current_command} "
set -g pane-border-lines single

# Command prompt + copy-mode selection, on-palette
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#585b70,fg=#cdd6f4"

# ---- TPM ----
# Keep this line at the very bottom of the file. It must run AFTER status-right is
# composed above: tmux-continuum prepends its auto-save hook to status-right when it
# loads, and any later `set -g status-right ...` silently wipes that hook (which is
# what killed auto-save between 2026-07-26 and 2026-07-31).
run '~/.config/tmux/plugins/tpm/tpm'
